<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" />
    <!-- No maximum-scale/user-scalable=no: that blocks pinch-to-zoom, a
         WCAG 1.4.4 failure and a real problem on the small text this app
         uses (text-xs, text-[10px] in several places) on phones/tablets,
         which is most of this app's install base. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; child-src 'self' blob:;" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), usb=(), serial=(), bluetooth=(), midi=(), payment=(), accelerometer=(), gyroscope=(), magnetometer=()" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>SnapCtrl</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
