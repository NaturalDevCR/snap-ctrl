<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#0b1322" />
    <meta name="apple-mobile-web-app-title" content="SnapCtrl" />
    <!-- maximum-scale/user-scalable=no blocks pinch-to-zoom, a WCAG 1.4.4
         failure for anyone relying on it with this app's small text
         (text-xs, text-[10px] in several places). Accepted deliberately:
         accidental zoom broke touch navigation in this kiosk-style control
         surface, which was judged worse. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; child-src 'self' blob:;" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), usb=(), serial=(), bluetooth=(), midi=(), payment=(), accelerometer=(), gyroscope=(), magnetometer=()" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>SnapCtrl</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
